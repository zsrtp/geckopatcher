[package]
name = "gecko-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "^1.0", optional = true }
serde-binary = "^0.5"
aes = "^0.8"
sha1 = "^0.10"
cbc = "^0.1"
encoding_rs = "^0.8"
byteorder = "^1.4"
lazy_static = "1.5"
rand = { version = "^0.9" }
rand_chacha = "^0.9"
log = { version = "^0.4", optional = true }
rsa = { version = "^0.9", features = ["sha1"] }
cstr_core = { version = "^0.2" }

[features]
default = ["serde"]
serde = ["dep:serde"]
fs = []
log = ["dep:log"]
